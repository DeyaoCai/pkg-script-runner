<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>截屏</title>
    <link rel="stylesheet" href="./screenshot.css" />
  </head>
  <body>
    <div id="app" class="ss-app">
      <canvas id="base" class="ss-canvas"></canvas>
      <canvas id="draw" class="ss-canvas ss-draw"></canvas>
      <div id="selectMask" class="ss-select-mask" hidden></div>
      <div id="selectBox" class="ss-select-box" hidden>
        <span class="ss-handle" data-dir="nw" aria-hidden="true"></span>
        <span class="ss-handle" data-dir="n" aria-hidden="true"></span>
        <span class="ss-handle" data-dir="ne" aria-hidden="true"></span>
        <span class="ss-handle" data-dir="e" aria-hidden="true"></span>
        <span class="ss-handle" data-dir="se" aria-hidden="true"></span>
        <span class="ss-handle" data-dir="s" aria-hidden="true"></span>
        <span class="ss-handle" data-dir="sw" aria-hidden="true"></span>
        <span class="ss-handle" data-dir="w" aria-hidden="true"></span>
      </div>

      <div id="hint" class="ss-hint">拖选截取区域 · Enter 确认 · Esc 取消</div>

      <div id="toolbar" class="ss-toolbar" hidden>
        <button
          type="button"
          class="ss-tool is-active"
          data-tool="move"
          title="抓手：拖动调整选区位置；角/边可改大小"
          aria-label="抓手"
        >
          <svg class="ss-ico" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M11 7.5V4.2a1.2 1.2 0 0 1 2.4 0V11h1.1V5.8a1.2 1.2 0 1 1 2.4 0V11h1.1V7.4a1.2 1.2 0 1 1 2.4 0v7.1c0 3.4-2.2 6.5-5.5 7.4l-.7.2c-2.5.6-5.1-.3-6.7-2.3L5.2 16a1.6 1.6 0 0 1 .2-2.2 1.5 1.5 0 0 1 2.1.2l1.5 1.7V7.5A1.2 1.2 0 0 1 11 7.5Z"
            />
          </svg>
        </button>
        <button
          type="button"
          class="ss-tool"
          data-tool="rect"
          title="画框"
          aria-label="画框"
        >
          <svg class="ss-ico" viewBox="0 0 24 24" aria-hidden="true">
            <rect
              x="4.5"
              y="5.5"
              width="15"
              height="13"
              rx="1.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            />
          </svg>
        </button>
        <button
          type="button"
          class="ss-tool"
          data-tool="pen"
          title="画笔"
          aria-label="画笔"
        >
          <svg class="ss-ico" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M4.2 17.6 15.8 6l2.2 2.2L6.4 19.8H4.2v-2.2Zm13-13.1 1.5-1.5a1.2 1.2 0 0 1 1.7 0l1.6 1.6a1.2 1.2 0 0 1 0 1.7L20.5 7.8 17.2 4.5Z"
            />
          </svg>
        </button>
        <button
          type="button"
          class="ss-tool"
          data-tool="pin"
          title="标记点（自动标序）"
          aria-label="标记点"
        >
          <svg class="ss-ico" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12 2.8c-3.4 0-6.2 2.7-6.2 6.1 0 4.5 5.4 10.6 5.7 10.9a.7.7 0 0 0 1 0c.3-.3 5.7-6.4 5.7-10.9 0-3.4-2.8-6.1-6.2-6.1Zm0 8.4a2.4 2.4 0 1 1 0-4.8 2.4 2.4 0 0 1 0 4.8Z"
            />
          </svg>
        </button>
        <button
          type="button"
          class="ss-tool ss-tool-pick"
          data-tool="pick"
          title="拾色器：点击截图取色"
          aria-label="拾色器"
        >
          <svg class="ss-ico" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="m14.1 4.3 5.6 5.6-1.4 1.4-1.5-1.5-5.7 5.7.1 2.1-1.5 1.5-3.6-3.6 1.5-1.5 2.1.1 5.7-5.7-1.5-1.5 1.2-1.6Zm-7.3 12.2 1.8 1.8-.7 1.6a1 1 0 0 1-1.6.3l-2.2-2.2a1 1 0 0 1 .3-1.6l1.6-.7.8.8Z"
            />
          </svg>
          <span class="ss-pick-dot" id="pickDot" aria-hidden="true"></span>
        </button>
        <button
          type="button"
          class="ss-tool ss-tool-snap"
          id="snapBtn"
          data-action="snap"
          title="吸附：对齐屏幕/窗口边缘（S）"
          aria-label="吸附"
          aria-pressed="false"
        >
          <svg class="ss-ico" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M7.2 3.5h3.1c.6 0 1.1.5 1.1 1.1v7.2a2.6 2.6 0 1 0 5.2 0V4.6c0-.6.5-1.1 1.1-1.1h3.1c.6 0 1.1.5 1.1 1.1v7.2a7.4 7.4 0 0 1-14.8 0V4.6c0-.6.5-1.1 1.1-1.1Z"
            />
          </svg>
        </button>
        <label class="ss-color" title="选择绘制颜色">
          <input type="color" id="colorInput" value="#3d8bfd" aria-label="绘制颜色" />
          <span id="colorHex" class="ss-color-hex">#3D8BFD</span>
        </label>
        <span class="ss-sep"></span>
        <button type="button" class="ss-btn" id="undoBtn" title="撤销">撤销</button>
        <button type="button" class="ss-btn primary" id="doneBtn" title="完成并复制">完成</button>
        <button type="button" class="ss-btn" id="cancelBtn" title="取消">取消</button>
      </div>
      <div id="pickTip" class="ss-pick-tip" hidden>
        <span id="pickSwatch" class="ss-pick-swatch"></span>
        <span id="pickHexLabel">#000000</span>
      </div>

      <aside id="side" class="ss-side" hidden>
        <div class="ss-side-title">标记文案</div>
        <div id="pinList" class="ss-pin-list"></div>
        <p class="ss-side-hint">完成后图文会写入剪贴板，并进入截屏历史</p>
      </aside>
    </div>
    <script src="./screenshot.js"></script>
  </body>
</html>
