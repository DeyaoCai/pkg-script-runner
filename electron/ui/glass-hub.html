<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glass Hub</title>
    <link rel="stylesheet" href="./fonts/jetbrains-mono.css" />
    <link rel="stylesheet" href="./glass-hub.css" />
  </head>
  <body>
    <div class="hub">
      <header class="bar">
        <div class="bar-drag">
          <strong>外观试验</strong>
          <span class="tag">点一项开二级窗 · 主窗保持实色</span>
        </div>
        <button type="button" class="x" id="closeBtn" title="关闭">×</button>
      </header>
      <main class="body">
        <p class="hint">
          不同方案可调项不同：系统材质没有「模糊半径」滑块（系统不开放）；CSS clip
          多圆角半径；纯 CSS 多模糊/饱和度（桌面模糊通常仍无效）。
        </p>
        <div class="list" id="list"></div>
      </main>
    </div>
    <script src="./glass-hub.js"></script>
  </body>
</html>
