appId: local.pkg-runner.runner
productName: Pkg Runner
copyright: Copyright © DS Agent
artifactName: PkgRunner-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - dist-ui/**/*
  - ui/**/*
  - assets/**/*
  - package.json
  # 开发产物 / 调试符号
  - '!**/*.map'
  - '!**/*.pdb'
  - '!**/*.ts'
  - '!**/tsconfig*.json'
  # Vue 源码在 apps/web，产物为 dist-ui
  - '!**/apps/web/**'
  # node-pty：仅保留当前目标平台预编译（本项目 dist:win 为 x64）
  - '!**/node_modules/node-pty/prebuilds/darwin-*/**'
  - '!**/node_modules/node-pty/prebuilds/win32-arm64/**'
  - '!**/node_modules/node-pty/deps/**'
  - '!**/node_modules/node-pty/src/**'
  - '!**/node_modules/node-pty/third_party/**'
  - '!**/node_modules/node-pty/scripts/**'
  - '!**/node_modules/node-pty/build/**'
  - '!**/node_modules/node-pty/binding.gyp'
  - '!**/node_modules/node-pty/**/*.md'
  # koffi / 其它杂项
  - '!**/node_modules/koffi/doc/**'
  - '!**/node_modules/koffi/vendor/**'
  - '!**/node_modules/koffi/**/*.{md,cc,hh,h,c,S,asm,cmake,txt}'
  - '!**/node_modules/**/{README,CHANGELOG,HISTORY,LICENSE,LICENCE,NOTICE}*'
  - '!**/node_modules/**/{test,tests,__tests__,docs,example,examples,benchmark}/**'
asar: true
asarUnpack:
  - '**/*.node'
  - '**/node-pty/prebuilds/**'
# 只留中英语言包（Electron locales 默认约 40MB）
electronLanguages:
  - en-US
  - zh-CN
compression: maximum
npmRebuild: false
win:
  target:
    - target: portable
      arch:
        - x64
  icon: assets/icon.png
  executableName: PkgRunner
portable:
  artifactName: PkgRunner-${version}-portable.exe
