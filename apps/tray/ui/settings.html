<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>设置</title>
    <script>
      (function () {
        var q = new URLSearchParams(location.search).get('env');
        window.__bootEnv = q === 'test' ? 'test' : 'prod';
        document.documentElement.setAttribute('data-env', window.__bootEnv);
      })();
    </script>
    <link rel="stylesheet" href="./tokens.css" />
    <script src="./pkg-tokens.js"></script>
    <script>
      (function () {
        var env = window.__bootEnv === 'test' ? 'test' : 'prod';
        PkgTokens.bootDocumentTheme({
          colorEnv: env,
          theme: 'dark',
          titleForEnv: function (e) {
            return '设置 · ' + (e === 'test' ? '测试' : '正式');
          },
        });
      })();
    </script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font: 13px/1.45 system-ui, 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--fg);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .shell {
        flex: 1;
        padding: 18px 20px 12px;
        overflow: auto;
      }

      .head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }

      .head h1 {
        font-size: 16px;
        font-weight: 650;
        margin: 0 0 4px;
        letter-spacing: -0.01em;
      }

      .sub {
        color: var(--muted);
        font-size: 12px;
        margin: 0;
        max-width: 42em;
      }

      .sub code {
        font-size: 11px;
        word-break: break-all;
        color: var(--fg);
        background: var(--accent-soft);
        padding: 1px 5px;
        border-radius: 4px;
      }

      .env-badge {
        display: inline-block;
        margin-left: 8px;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 650;
        vertical-align: middle;
        background: var(--accent-soft);
        color: var(--accent);
        border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
      }

      .card {
        background: var(--bg-raised);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px 14px 6px;
        margin-bottom: 12px;
        box-shadow: 0 1px 0 var(--shadow);
      }

      .sec {
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 12px;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
        min-height: 32px;
      }

      .row.wrap {
        flex-wrap: wrap;
      }

      label.field {
        min-width: 108px;
        color: var(--muted);
        flex-shrink: 0;
      }

      .hint {
        width: 100%;
        margin: -4px 0 12px 118px;
        font-size: 11px;
        color: var(--muted);
      }

      .seg {
        display: inline-flex;
        padding: 3px;
        gap: 2px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg-input);
      }

      .seg button {
        border: 0;
        background: transparent;
        color: var(--muted);
        border-radius: 6px;
        padding: 6px 14px;
        cursor: pointer;
        font: inherit;
        font-weight: 550;
      }

      .seg button:hover {
        color: var(--fg);
      }

      .seg button.is-active {
        background: var(--accent-soft);
        color: var(--accent);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent);
      }

      .btn {
        border: 1px solid var(--line);
        background: var(--bg-input);
        color: var(--fg);
        border-radius: 7px;
        padding: 6px 12px;
        cursor: pointer;
        font: inherit;
      }

      .btn:hover {
        border-color: var(--line-strong);
      }

      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
        font-weight: 600;
      }

      .btn.primary:hover {
        filter: brightness(1.06);
      }

      .btn:disabled {
        opacity: 0.55;
        cursor: wait;
      }

      select,
      input[type='number'],
      input[type='text'] {
        border-radius: 7px;
        border: 1px solid var(--line);
        background: var(--bg-input);
        color: var(--fg);
        padding: 6px 8px;
        font: inherit;
        min-height: 32px;
      }

      select {
        min-width: 168px;
      }

      input[type='range'] {
        flex: 1;
        accent-color: var(--accent);
      }

      #brandColor {
        width: 36px;
        height: 32px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: transparent;
        cursor: pointer;
      }

      #brandColorHex {
        width: 92px;
        font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
        letter-spacing: 0.02em;
      }

      .brand-preset[data-brand-preset='prod'] {
        border-color: var(--preset-prod);
        color: var(--preset-prod);
      }

      .brand-preset[data-brand-preset='test'] {
        border-color: var(--preset-test);
        color: var(--preset-test);
      }

      .brand-preset.is-active {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--accent);
      }

      .check {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        color: var(--fg);
        cursor: pointer;
        user-select: none;
      }

      .check input {
        accent-color: var(--accent);
        width: 15px;
        height: 15px;
      }

      .grow {
        flex: 1;
        min-width: 0;
        text-align: left;
      }

      .recording {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      .status {
        min-height: 1.2em;
        margin: 4px 0 0;
        font-size: 12px;
        color: var(--danger);
      }

      .status.ok {
        color: var(--ok);
      }

      .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 12px 20px 16px;
        border-top: 1px solid var(--line);
        background: color-mix(in srgb, var(--bg-raised) 88%, transparent);
        position: sticky;
        bottom: 0;
      }

      .footer-actions {
        display: flex;
        gap: 8px;
      }

      .swatch {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        border: 1px solid color-mix(in srgb, var(--fg) 20%, transparent);
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="head">
        <div>
          <h1>设置 <span class="env-badge" id="envBadge"></span></h1>
          <p class="sub" id="settingsSub">正在识别配置目录…</p>
        </div>
      </div>

      <div class="card">
        <div class="sec">窗口</div>
        <div class="row wrap">
          <label class="field">唤起</label>
          <button type="button" class="btn" id="btnShowRunner">打开 Runner</button>
          <button type="button" class="btn" id="btnShowEditor">打开编辑器</button>
        </div>
        <p class="hint" id="appHint">显示当前配置环境；可从这里唤起窗口。</p>
      </div>

      <div class="card">
        <div class="sec">外观</div>
        <div class="row">
          <label class="field">主题</label>
          <div class="seg" id="themeSeg" role="group" aria-label="主题">
            <button type="button" data-theme-choice="dark">深色</button>
            <button type="button" data-theme-choice="light">浅色</button>
          </div>
          <input type="hidden" id="theme" value="dark" />
        </div>
        <div class="row">
          <label class="field">字体</label>
          <select id="fontId"></select>
        </div>
        <div class="row wrap">
          <label class="field" title="主色调种子：铺底由此低饱和派生；点缀用同一色的鲜明形态">主色调</label>
          <input type="color" id="brandColor" title="拾色器" />
          <input
            type="text"
            id="brandColorHex"
            maxlength="7"
            spellcheck="false"
            title="十六进制颜色"
          />
          <button type="button" class="btn brand-preset" data-brand-preset="prod" id="brandPresetProd">
            <span class="swatch" id="swatchProd" style="display: inline-block; vertical-align: -2px; margin-right: 6px; width: 10px; height: 10px; border-radius: 2px"></span>正式
          </button>
          <button type="button" class="btn brand-preset" data-brand-preset="test" id="brandPresetTest">
            <span class="swatch" id="swatchTest" style="display: inline-block; vertical-align: -2px; margin-right: 6px; width: 10px; height: 10px; border-radius: 2px"></span>测试
          </button>
        </div>
        <p class="hint">正式 / 测试为预设主色；自定义色会同时影响铺底与点缀。</p>
        <div class="row">
          <label class="field">面板不透明度</label>
          <input type="range" id="glassAlpha" min="10" max="100" step="1" class="grow" />
          <span id="glassAlphaVal" style="min-width: 40px; color: var(--muted); text-align: right">100%</span>
        </div>
        <label class="check">
          <input type="checkbox" id="alwaysOnTop" />
          <span>Runner 始终置顶</span>
        </label>
      </div>

      <div class="card">
        <div class="sec">Runner</div>
        <div class="row">
          <label class="field">Shell 列数</label>
          <input type="number" id="shellMosaicCols" min="1" max="4" step="1" style="width: 88px" />
        </div>
        <div class="row">
          <label class="field">Shell 布局</label>
          <div class="seg" id="layoutSeg" role="group" aria-label="Shell 布局">
            <button type="button" data-layout-choice="grid">网格</button>
            <button type="button" data-layout-choice="single">单页</button>
          </div>
          <input type="hidden" id="shellLayout" value="grid" />
        </div>
        <label class="check">
          <input type="checkbox" id="persistLogs" />
          <span>脚本日志落盘</span>
        </label>
      </div>

      <div class="card">
        <div class="sec">热键</div>
        <label class="check">
          <input type="checkbox" id="hotkeysEnabled" />
          <span>启用全局热键</span>
        </label>
        <div class="row">
          <label class="field">截屏</label>
          <button type="button" class="btn grow" id="shotHotkeyBtn">加载中…</button>
          <button type="button" class="btn" id="clearShot">清除</button>
        </div>
        <div class="row">
          <label class="field">显示 Runner</label>
          <button type="button" class="btn grow" id="actHotkeyBtn">加载中…</button>
          <button type="button" class="btn" id="clearAct">清除</button>
        </div>
        <div class="row">
          <label class="field">显示编辑器</label>
          <button type="button" class="btn grow" id="editorHotkeyBtn">加载中…</button>
          <button type="button" class="btn" id="clearEditor">清除</button>
        </div>
        <div class="row">
          <label class="field">截屏历史</label>
          <input type="number" id="historyLimit" min="1" max="100" style="width: 88px" />
          <span style="color: var(--muted)">条</span>
        </div>
      </div>

      <p class="status" id="err"></p>
    </div>

    <div class="footer">
      <button type="button" class="btn" id="diagBtn" title="打开诊断日志">日志</button>
      <div class="footer-actions">
        <button type="button" class="btn" id="closeBtn">关闭</button>
        <button type="button" class="btn" id="applyBtn" title="写入并立即生效，不关闭窗口">应用</button>
        <button type="button" class="btn primary" id="saveBtn" title="写入并关闭">保存</button>
      </div>
    </div>

    <script>
      (function () {
        var b = document.getElementById('envBadge');
        if (b) b.textContent = window.__bootEnv === 'test' ? '测试' : '正式';
      })();

      function dlog(event, detail) {
        void getTrayApi()?.diagLog?.(event, detail);
      }
      const FONTS = [
        { id: 'jetbrains', label: 'JetBrains Mono' },
        { id: 'system', label: '系统默认' },
        { id: 'segoe', label: 'Segoe UI' },
        { id: 'cascadia', label: 'Cascadia Code' },
        { id: 'consolas', label: 'Consolas' },
      ];
      let recording = null;
      let pendingShot = '';
      let pendingAct = '';
      let pendingEditor = '';
      let settingsHydrated = false;

      function getTrayApi() {
        return window.trayApi;
      }

      function formatHotkey(accel) {
        const raw = String(accel || '').trim();
        if (!raw) return '未设置 · 点击录制';
        return raw
          .replace(/CommandOrControl/gi, 'Ctrl')
          .replace(/Control/gi, 'Ctrl')
          .replace(/Shift/gi, 'Shift')
          .replace(/Alt/gi, 'Alt');
      }

      function keyToAccel(e) {
        if (['Control', 'Shift', 'Alt', 'Meta'].includes(e.key)) return '';
        const parts = [];
        if (e.ctrlKey || e.metaKey) parts.push('CommandOrControl');
        if (e.altKey) parts.push('Alt');
        if (e.shiftKey) parts.push('Shift');
        let key = e.key;
        if (key === ' ') key = 'Space';
        else if (key.length === 1) key = key.toUpperCase();
        else if (key.startsWith('Arrow')) key = key.slice(5);
        parts.push(key);
        return parts.join('+');
      }

      const fontSel = document.getElementById('fontId');
      for (const f of FONTS) {
        const o = document.createElement('option');
        o.value = f.id;
        o.textContent = f.label;
        fontSel.appendChild(o);
      }

      document.getElementById('glassAlpha').oninput = (e) => {
        document.getElementById('glassAlphaVal').textContent = e.target.value + '%';
      };

      const T = window.PkgTokens;
      const BRAND_PRESET_PROD = T.BRAND_PRESET_PROD;
      const BRAND_PRESET_TEST = T.BRAND_PRESET_TEST;
      const normalizeHexColor = (raw, fallback) =>
        T.normalizeBrandColor(raw, fallback || BRAND_PRESET_PROD);

      (function syncPresetSwatches() {
        const prod = document.getElementById('swatchProd');
        const test = document.getElementById('swatchTest');
        const prodBtn = document.getElementById('brandPresetProd');
        const testBtn = document.getElementById('brandPresetTest');
        if (prod) prod.style.background = BRAND_PRESET_PROD;
        if (test) test.style.background = BRAND_PRESET_TEST;
        if (prodBtn) prodBtn.title = BRAND_PRESET_PROD;
        if (testBtn) testBtn.title = BRAND_PRESET_TEST;
        const color = document.getElementById('brandColor');
        const hex = document.getElementById('brandColorHex');
        if (color && !color.dataset.touched) color.value = BRAND_PRESET_PROD;
        if (hex && !hex.dataset.touched) hex.value = BRAND_PRESET_PROD;
      })();

      function applyThemeUi(theme) {
        const t = T.applyTheme(theme);
        document.getElementById('theme').value = t;
        document.querySelectorAll('#themeSeg [data-theme-choice]').forEach((btn) => {
          btn.classList.toggle('is-active', btn.getAttribute('data-theme-choice') === t);
        });
      }

      function applyLayoutUi(layout) {
        const v = layout === 'single' ? 'single' : 'grid';
        document.getElementById('shellLayout').value = v;
        document.querySelectorAll('#layoutSeg [data-layout-choice]').forEach((btn) => {
          btn.classList.toggle('is-active', btn.getAttribute('data-layout-choice') === v);
        });
      }

      function applyBrandCss(hex) {
        const c = T.applyBrandColor(hex);
        const prodBtn = document.querySelector('.brand-preset[data-brand-preset="prod"]');
        const testBtn = document.querySelector('.brand-preset[data-brand-preset="test"]');
        if (prodBtn) prodBtn.classList.toggle('is-active', c === BRAND_PRESET_PROD);
        if (testBtn) testBtn.classList.toggle('is-active', c === BRAND_PRESET_TEST);
      }

      function setBrandColorUi(hex) {
        const c = normalizeHexColor(hex);
        document.getElementById('brandColor').value = c;
        document.getElementById('brandColorHex').value = c;
        applyBrandCss(c);
      }

      document.getElementById('themeSeg').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-theme-choice]');
        if (!btn) return;
        applyThemeUi(btn.getAttribute('data-theme-choice'));
      });

      document.getElementById('layoutSeg').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-layout-choice]');
        if (!btn) return;
        applyLayoutUi(btn.getAttribute('data-layout-choice'));
      });

      document.getElementById('brandColor').oninput = (e) => {
        setBrandColorUi(e.target.value);
      };
      document.getElementById('brandColorHex').onchange = (e) => {
        setBrandColorUi(e.target.value);
      };
      document.getElementById('brandColorHex').onkeydown = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          setBrandColorUi(e.target.value);
        }
      };
      document.querySelectorAll('.brand-preset').forEach((btn) => {
        btn.addEventListener('click', () => {
          const preset = btn.getAttribute('data-brand-preset');
          setBrandColorUi(preset === 'test' ? BRAND_PRESET_TEST : BRAND_PRESET_PROD);
        });
      });

      function setStatus(text, ok) {
        const el = document.getElementById('err');
        el.textContent = text || '';
        el.classList.toggle('ok', !!ok);
      }

      async function ensureApi(maxMs) {
        const limit = maxMs || 1500;
        const start = Date.now();
        while (Date.now() - start < limit) {
          const api = getTrayApi();
          if (api?.getSettings && api?.setSettings && api?.closeWindow) return api;
          await new Promise((r) => setTimeout(r, 40));
        }
        return getTrayApi();
      }

      function readFormPatch() {
        return {
          screenshotHotkey: pendingShot,
          activateHotkey: pendingAct,
          editorHotkey: pendingEditor,
          screenshotHistoryLimit: Number(document.getElementById('historyLimit').value),
          fontId: fontSel.value,
          theme: document.getElementById('theme').value,
          brandColor: normalizeHexColor(document.getElementById('brandColor').value),
          glassAlpha: Number(document.getElementById('glassAlpha').value),
          alwaysOnTop: document.getElementById('alwaysOnTop').checked,
          shellMosaicCols: Number(document.getElementById('shellMosaicCols').value),
          shellLayout: document.getElementById('shellLayout').value,
          persistLogs: document.getElementById('persistLogs').checked,
          hotkeysEnabled: document.getElementById('hotkeysEnabled').checked,
        };
      }

      async function closeSettingsWindow() {
        const api = await ensureApi(800);
        if (api?.closeWindow) {
          await api.closeWindow();
          return;
        }
        setStatus('无法关闭：托盘 API 不可用', false);
      }

      function applyProfile(p) {
        if (!p || typeof p !== 'object') return;
        const isTest = p.colorEnv === 'test';
        document.documentElement.setAttribute('data-env', isTest ? 'test' : 'prod');
        const badge = document.getElementById('envBadge');
        badge.textContent = isTest ? '测试' : '正式';
        badge.title = p.profile || '';
        const sub = document.getElementById('settingsSub');
        const pathText = p.settingsPath || '';
        sub.innerHTML =
          '配置：<code></code>（' +
          (p.packaged ? '安装包' : '开发') +
          ' · ' +
          (p.profile || '?') +
          '）';
        const code = sub.querySelector('code');
        if (code) code.textContent = pathText;
        document.title = '设置 · ' + (isTest ? '测试' : '正式');
        const appHint = document.getElementById('appHint');
        if (appHint) {
          appHint.textContent =
            (isTest ? '测试' : '正式') +
            ' · ' +
            (p.packaged ? '安装包' : '开发') +
            ' · ' +
            (p.profile || '?') +
            ' — 可从这里唤起窗口。';
        }
        dlog('profile', {
          profile: p.profile,
          colorEnv: p.colorEnv,
          settingsPath: p.settingsPath,
        });
      }
      window.__applyTrayProfile = applyProfile;

      document.getElementById('btnShowRunner').onclick = async () => {
        const api = getTrayApi();
        try {
          await api?.showRunner?.();
          setStatus('已打开 Runner', true);
        } catch (e) {
          setStatus(e instanceof Error ? e.message : String(e), false);
        }
      };
      document.getElementById('btnShowEditor').onclick = async () => {
        const api = getTrayApi();
        try {
          await api?.showEditor?.();
          setStatus('已打开编辑器', true);
        } catch (e) {
          setStatus(e instanceof Error ? e.message : String(e), false);
        }
      };
      function applySettings(s) {
        settingsHydrated = true;
        dlog('apply', {
          screenshotHotkey: s?.screenshotHotkey,
          activateHotkey: s?.activateHotkey,
          editorHotkey: s?.editorHotkey,
          theme: s?.theme,
          fontId: s?.fontId,
        });
        pendingShot = s.screenshotHotkey || '';
        pendingAct = s.activateHotkey || '';
        pendingEditor = s.editorHotkey || '';
        document.getElementById('shotHotkeyBtn').textContent = formatHotkey(pendingShot);
        document.getElementById('actHotkeyBtn').textContent = formatHotkey(pendingAct);
        document.getElementById('editorHotkeyBtn').textContent = formatHotkey(pendingEditor);
        document.getElementById('historyLimit').value = String(s.screenshotHistoryLimit ?? 10);
        fontSel.value = s.fontId || 'jetbrains';
        applyThemeUi(s.theme || 'dark');
        setBrandColorUi(
          s.brandColor ||
            (s.brandTone === 'test' ? BRAND_PRESET_TEST : BRAND_PRESET_PROD),
        );
        document.getElementById('glassAlpha').value = String(s.glassAlpha ?? 100);
        document.getElementById('glassAlphaVal').textContent = (s.glassAlpha ?? 100) + '%';
        document.getElementById('alwaysOnTop').checked = !!s.alwaysOnTop;
        document.getElementById('shellMosaicCols').value = String(s.shellMosaicCols ?? 2);
        applyLayoutUi(s.shellLayout || 'grid');
        document.getElementById('persistLogs').checked = !!s.persistLogs;
        document.getElementById('hotkeysEnabled').checked = s.hotkeysEnabled !== false;
        setStatus('', false);
      }
      window.__applyTraySettings = applySettings;

      async function load() {
        const api = getTrayApi();
        dlog('load.start', {
          hasApi: !!api,
          hasGetSettings: typeof api?.getSettings === 'function',
          hydrated: settingsHydrated,
        });
        if (!api?.getSettings) {
          if (settingsHydrated) {
            dlog('load.skip', { reason: 'already hydrated via tray inject' });
            return;
          }
          document.getElementById('err').textContent =
            '无法连接托盘 API，请关闭后从托盘重新打开设置';
          dlog('load.fail', { reason: 'no trayApi.getSettings', hydrated: settingsHydrated });
          return;
        }
        try {
          if (typeof api.getProfile === 'function') {
            applyProfile(await api.getProfile());
          }
          const s = await api.getSettings();
          dlog('load.ok', {
            screenshotHotkey: s?.screenshotHotkey,
            activateHotkey: s?.activateHotkey,
            editorHotkey: s?.editorHotkey,
            theme: s?.theme,
          });
          applySettings(s);
        } catch (e) {
          const msg = e instanceof Error ? e.message : String(e);
          document.getElementById('err').textContent = '加载设置失败：' + msg;
          dlog('load.error', { message: msg });
        }
      }

      async function startRecord(kind) {
        recording = kind;
        const btn =
          kind === 'screenshot'
            ? 'shotHotkeyBtn'
            : kind === 'activate'
              ? 'actHotkeyBtn'
              : 'editorHotkeyBtn';
        document.getElementById(btn).classList.add('recording');
        document.getElementById(btn).textContent = '按下热键…';
        document.getElementById('err').textContent = '';
        await getTrayApi()?.suspendHotkeys?.();
      }

      document.getElementById('shotHotkeyBtn').onclick = () => startRecord('screenshot');
      document.getElementById('actHotkeyBtn').onclick = () => startRecord('activate');
      document.getElementById('editorHotkeyBtn').onclick = () => startRecord('editor');
      document.getElementById('clearShot').onclick = () => {
        pendingShot = '';
        document.getElementById('shotHotkeyBtn').textContent = formatHotkey('');
      };
      document.getElementById('clearAct').onclick = () => {
        pendingAct = '';
        document.getElementById('actHotkeyBtn').textContent = formatHotkey('');
      };
      document.getElementById('clearEditor').onclick = () => {
        pendingEditor = '';
        document.getElementById('editorHotkeyBtn').textContent = formatHotkey('');
      };

      window.addEventListener('keydown', async (e) => {
        if (!recording) return;
        e.preventDefault();
        if (e.key === 'Escape') {
          recording = null;
          document.getElementById('shotHotkeyBtn').classList.remove('recording');
          document.getElementById('actHotkeyBtn').classList.remove('recording');
          document.getElementById('editorHotkeyBtn').classList.remove('recording');
          document.getElementById('shotHotkeyBtn').textContent = formatHotkey(pendingShot);
          document.getElementById('actHotkeyBtn').textContent = formatHotkey(pendingAct);
          document.getElementById('editorHotkeyBtn').textContent = formatHotkey(pendingEditor);
          await getTrayApi()?.resumeHotkeys?.();
          return;
        }
        const accel = keyToAccel(e);
        if (!accel) return;
        if (recording === 'screenshot') pendingShot = accel;
        else if (recording === 'activate') pendingAct = accel;
        else pendingEditor = accel;
        recording = null;
        document.getElementById('shotHotkeyBtn').classList.remove('recording');
        document.getElementById('actHotkeyBtn').classList.remove('recording');
        document.getElementById('editorHotkeyBtn').classList.remove('recording');
        document.getElementById('shotHotkeyBtn').textContent = formatHotkey(pendingShot);
        document.getElementById('actHotkeyBtn').textContent = formatHotkey(pendingAct);
        document.getElementById('editorHotkeyBtn').textContent = formatHotkey(pendingEditor);
        await getTrayApi()?.resumeHotkeys?.();
      });

      /** @returns {Promise<boolean>} true = 已写入且无热键错误 */
      async function persistSettings(kind) {
        const api = await ensureApi();
        if (!api?.setSettings) {
          setStatus('无法' + kind + '：托盘 API 不可用', false);
          return false;
        }
        const res = await api.setSettings(readFormPatch());
        if (res.hotkeyError) {
          setStatus(res.hotkeyError, false);
          pendingShot = res.settings.screenshotHotkey;
          pendingAct = res.settings.activateHotkey;
          pendingEditor = res.settings.editorHotkey;
          document.getElementById('shotHotkeyBtn').textContent = formatHotkey(pendingShot);
          document.getElementById('actHotkeyBtn').textContent = formatHotkey(pendingAct);
          document.getElementById('editorHotkeyBtn').textContent = formatHotkey(pendingEditor);
          return false;
        }
        applySettings(res.settings);
        return true;
      }

      document.getElementById('applyBtn').onclick = async () => {
        const applyBtn = document.getElementById('applyBtn');
        const saveBtn = document.getElementById('saveBtn');
        applyBtn.disabled = true;
        saveBtn.disabled = true;
        const prev = applyBtn.textContent;
        applyBtn.textContent = '应用中…';
        dlog('apply.click');
        try {
          const ok = await persistSettings('应用');
          if (ok) {
            setStatus('已应用', true);
            dlog('apply.ok');
          }
        } catch (e) {
          const msg = e instanceof Error ? e.message : String(e);
          setStatus('应用失败：' + msg, false);
          dlog('apply.error', { message: msg });
        } finally {
          applyBtn.disabled = false;
          saveBtn.disabled = false;
          applyBtn.textContent = prev;
        }
      };

      document.getElementById('saveBtn').onclick = async () => {
        const applyBtn = document.getElementById('applyBtn');
        const saveBtn = document.getElementById('saveBtn');
        saveBtn.disabled = true;
        applyBtn.disabled = true;
        const prev = saveBtn.textContent;
        saveBtn.textContent = '保存中…';
        dlog('save.click');
        try {
          const api = await ensureApi();
          const ok = await persistSettings('保存');
          if (!ok) return;
          dlog('save.ok');
          await api.closeWindow();
        } catch (e) {
          const msg = e instanceof Error ? e.message : String(e);
          setStatus('保存失败：' + msg, false);
          dlog('save.error', { message: msg });
        } finally {
          saveBtn.disabled = false;
          applyBtn.disabled = false;
          saveBtn.textContent = prev;
        }
      };

      document.getElementById('closeBtn').onclick = () => {
        dlog('close.click');
        void closeSettingsWindow();
      };

      document.getElementById('diagBtn').onclick = async () => {
        dlog('diag.click');
        const api = await ensureApi(800);
        if (!api?.openDiagLog) {
          setStatus('无法打开日志：托盘 API 不可用', false);
          return;
        }
        try {
          const result = await api.openDiagLog();
          setStatus(result ? '已打开诊断日志' : '诊断日志文件尚未生成', !!result);
        } catch (e) {
          setStatus('打开日志失败：' + (e instanceof Error ? e.message : String(e)), false);
        }
      };

      function boot() {
        const api = getTrayApi();
        dlog('boot', {
          hasApi: !!api,
          hasGetSettings: typeof api?.getSettings === 'function',
          hydrated: settingsHydrated,
        });
        if (!api?.getSettings) {
          if (settingsHydrated) {
            dlog('boot.inject-only');
            return true;
          }
          return false;
        }
        if (!boot.ready) {
          api.onSettings?.((s) => {
            if (!recording) applySettings(s);
          });
          boot.ready = true;
        }
        void load();
        return true;
      }
      boot.ready = false;

      applyThemeUi('dark');
      applyLayoutUi('grid');

      if (!boot()) {
        let tries = 0;
        const trayTimer = setInterval(() => {
          tries += 1;
          if (boot()) {
            clearInterval(trayTimer);
          } else if (tries >= 40) {
            clearInterval(trayTimer);
            if (!settingsHydrated) {
              document.getElementById('err').textContent =
                '无法连接托盘 API，请关闭后从托盘重新打开设置';
            }
            dlog('boot.timeout', { tries, hydrated: settingsHydrated });
          }
        }, 50);
      }
    </script>
  </body>
</html>
